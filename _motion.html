<script>
(function () {
  var root = document.documentElement;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // No motion: leave everything in its finished state.
  if (reduce || !("IntersectionObserver" in window)) return;

  root.classList.add("js-motion");
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { root.classList.add("is-loaded"); });
  });

  // ---- one observer for everything that animates on entry ----
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var el = e.target;
      el.classList.add("in-view");
      io.unobserve(el);
      if (el.matches('[data-motion="scatter"]')) runScatter(el);
    });
  }, { threshold: 0.35 });

  document.querySelectorAll('[data-motion="scatter"], .work-fig').forEach(function (el) { io.observe(el); });

  // ---- hero scatter: points (CSS batches) -> outlier snaps -> fit draws ----
  function runScatter(fig) {
    var batches = 10, batchMs = 60, pointMs = 260;
    var pointsDone = (batches - 1) * batchMs + pointMs;
    setTimeout(function () { fig.classList.add("outlier-in"); }, pointsDone + 80);
    setTimeout(function () { fig.classList.add("fit-drawn"); }, pointsDone + 520);

    // hover / keyboard focus redraws the fit
    var svg = fig.querySelector("svg");
    var busy = false;
    function redraw() {
      if (busy || !fig.classList.contains("fit-drawn")) return;
      busy = true;
      var line = fig.querySelector(".fit");
      line.style.transition = "none";          // jump back to undrawn instantly
      fig.classList.remove("fit-drawn");
      void line.getBoundingClientRect();
      line.style.transition = "";
      requestAnimationFrame(function () { fig.classList.add("fit-drawn"); });
      setTimeout(function () { busy = false; }, 800);
    }
    svg.addEventListener("pointerenter", redraw);
    svg.addEventListener("focus", redraw);
  }
})();
</script>
